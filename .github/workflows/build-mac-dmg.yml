name: Build macOS DMG & Windows Setup

on:
  # Release builds only (DN-020): version tags or a manual run.
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS DMG Installer (Apple Silicon & Intel)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

      - name: Build macOS DMG and ZIP
        run: npx electron-builder --mac dmg zip --x64 --arm64
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Satyadhi-Sharma-Tech-macOS-Installer
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
