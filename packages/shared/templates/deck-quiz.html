/* ================= v2 · DESIGN SYSTEM POLISH ================= */
:root{--glass:rgba(21,26,58,.62);--glass-line:rgba(255,255,255,.09);--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--r-lg:24px;--r-md:16px}

.scene{container:scene/inline-size;border-radius:var(--r-lg);border:1px solid var(--glass-line);box-shadow:0 24px 70px #00000070,inset 0 1px 0 #ffffff14}

.adcar{position:relative;max-width:760px;margin:34px auto 0}
.adcar .slides{position:relative;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--glass-line);box-shadow:0 20px 60px #0008;background:#111}
.adcar .slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s var(--ease);cursor:zoom-in}.adcar .slides img.on{opacity:1}
.adcar .cd{display:flex;gap:8px;justify-content:center;margin-top:12px}.adcar .cd i{width:9px;height:9px;border-radius:50%;background:#ffffff30;cursor:pointer;transition:transform .25s var(--spring),background .3s}.adcar .cd i.on{background:var(--accent);transform:scale(1.35)}
.adscreen{max-width:880px;margin:3vh auto;text-align:center}
.adscreen h2{font-size:clamp(17px,2.4vw,22px);margin-bottom:6px}.adscreen p{color:var(--mute);font-size:13.5px;margin:0 0 16px}
.adscreen .nav{justify-content:center;gap:14px}
.lbx{position:fixed;inset:0;z-index:80;background:#05081ae6;backdrop-filter:blur(10px);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lbx img{max-width:min(1400px,100%);max-height:100%;border-radius:14px;box-shadow:0 30px 90px #000}
.resad{max-width:760px;margin:26px auto 0}.resad .adcard+.adcard{margin-top:14px}
@media(max-width:520px){.top .prog{position:absolute;left:0;right:0;bottom:-1px;height:3px;min-width:0;border-radius:0;box-shadow:none}.brand{flex:1}.bt b{overflow:hidden;text-overflow:ellipsis}}
@media(max-width:430px){.bt b{font-size:11.5px}.bt small{font-size:9.5px}.lg button{padding:6px 8px;font-size:11px}.logo{width:32px;height:32px}.top{padding-left:10px;padding-right:10px}}

/* ================= 60 / 40 LAYOUT: question gets the larger share ================= */
main{max-width:1380px}
.stage{grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(18px,2.6vw,40px)}
@media(min-width:921px){#qa{order:1}.scene{order:2;height:min(560px,calc(100vh - 110px))}}
.qt{font-size:clamp(20px,2.3vw,28px);line-height:1.45;margin-bottom:20px;font-weight:600}
.qt .hi{font-size:1.04em}.qt .en{font-size:.82em;margin-top:6px}
.qn{font-size:13px;padding:4px 14px;margin-bottom:14px}
.opts{gap:12px}
.opt{min-height:64px;padding:14px 18px;gap:14px}
.opt .l{width:34px;height:34px;font-size:14px}
.opt .tx{font-size:clamp(15.5px,1.45vw,19px);line-height:1.45}.opt .tx .en{font-size:.84em}
.opt.ok,.opt.no{padding-right:44px}
.exp{padding:16px 20px}.exp h4{font-size:15px}.exp .hi{font-size:15.5px}.exp .en{font-size:13.5px}
.exp.neutral{border-left-color:var(--accent)}
.revrow{margin-top:16px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid #ffc23c99;box-shadow:none}
.btn.ghost:hover{background:#ffc23c1c;box-shadow:0 10px 26px -8px #ffc23c66}
.btn kbd{font:600 10.5px ui-monospace,monospace;border:1px solid #ffc23c77;border-radius:5px;padding:1px 6px;margin-left:8px;opacity:.75}
.dots i.rv{background:#ffc23c66;box-shadow:inset 0 0 0 2px var(--accent)}
@media(max-width:920px){.stage{grid-template-columns:1fr}.qt{font-size:clamp(18px,4.6vw,22px)}.btn kbd{display:none}.revrow .btn{width:100%}}
/* Back / Next always reachable, even on long questions */
@media(min-width:921px){.nav{position:sticky;bottom:0;z-index:15;margin-top:18px;padding:14px 0 16px;background:linear-gradient(180deg,transparent,#0a0e24f2 38%)}}

.nav{align-items:center}.nav .ghost{flex:0 1 auto;padding-left:18px;padding-right:18px;white-space:nowrap}
@media(max-width:520px){.nav .btn{padding:12px 10px;font-size:14px;min-height:46px}.nav .ghost{padding:12px 10px}}
.nav .btn{white-space:nowrap}
@media(max-width:430px){.nav{gap:6px}.nav .btn{padding:12px 8px;font-size:12.5px}}

/* ================= COPYRIGHT WATERMARK ================= */
#wm{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.085;background-repeat:repeat;mix-blend-mode:normal}
.copy{max-width:900px;margin:40px auto 0;padding:18px 16px 30px;text-align:center;font-size:11.5px;line-height:1.5;color:#7f88b8;border-top:1px solid #ffffff12}
.scene::after{content:var(--mark,"");position:absolute;right:12px;bottom:9px;z-index:3;font:600 10.5px/1 Poppins,sans-serif;letter-spacing:.04em;color:#ffffffb0;background:#0a0e24a6;padding:5px 10px;border-radius:99px;pointer-events:none}
.scene.idh::after,.scene.bn3::after{display:none}
img{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
@media print{#wm{opacity:.2!important;display:block!important}.top,.nav,.dots{display:none}}
/* ================= LOGO BADGE + CONCEPT SCENE (EduSuite template) ================= */
.logo-img{width:100%;height:100%;object-fit:contain;border-radius:50%;background:#fff;display:block}
.logo.badge{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#0f172a;border:2px solid var(--accent);color:var(--accent);font-weight:700;font-size:15px;flex:none}
.cx{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding:22px 20px 44px;overflow:auto}
.cx-h{font-weight:700;font-size:clamp(16px,2.2vw,20px);color:var(--accent);line-height:1.35}
.cx-l{display:flex;flex-direction:column;gap:10px}
.cx-c{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:#ffffff0d;border:1px solid #ffffff1f;transition:opacity .45s,filter .45s,border-color .45s,box-shadow .45s,background .45s}
.cx-n{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:#10142e;font-weight:800;font-size:13px}
.cx-t{line-height:1.5;font-size:15px}
.cx-c.on{border-color:var(--c);box-shadow:0 0 26px -6px var(--c);background:#1b2150}
.cx-c.off{opacity:.45;filter:grayscale(.7)}
@media print{.cx{position:static}}

<body>
<header class="top">
  <div class="brand"><span id="logo" class="logo badge" aria-hidden="true"></span><span class="bt"><b>{{BRAND}}</b><small>{{SUBLINE}}</small></span></div>
  <div class="prog"><i id="pg"></i></div>
  <div class="score" id="sc"></div>
  <div class="lg"><button data-l="hi">हिन्दी</button><button data-l="en">English</button><button data-l="both" class="on">दोनों</button></div>
</header>
<div id="wm" aria-hidden="true"></div>
<main id="view"></main>
<footer class="copy">© <span id="yr"></span> {{BRAND}} · सर्वाधिकार सुरक्षित · All rights reserved. Questions and explanations may not be copied or republished without the institute's written permission.</footer>
<div id="fxlayer"></div>
<script>
/* ================= QUIZ DATA (filled in by EduSuite) =================
   CFG: { brand, title:{hi,en}, sub:{hi,en}, initials, logo (image data URL or "") }
   Q:   [{ q:{hi,en}, o:[4×{hi,en}], a:0-3, ex:{hi,en}, sc:{t:'concept', p:{title:{hi,en}, points:[{hi,en,key}]}} }] */
const CFG = /*{{CFG}}*/null;
const Q = /*{{Q}}*/[];
/* ================= SHARED HELPERS ================= */
/* ================= SHARED HELPERS ================= */
let lang = 'both';                       // 'hi' | 'en' | 'both'
const $ = (s, r = document) => r.querySelector(s);
const MO = (window.Motion && window.Motion.animate) ? window.Motion : null;   // motion.dev (CDN) – optional
const EASE = [0.22, 1, 0.36, 1];
/* user / device context */
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);          // reduced motion: no springs, no auto-spin
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.hardwareConcurrency || 8) <= 4 || Math.min(window.screen.width, window.screen.height) < 600;

/* Animate with motion.dev when loaded, otherwise fall back to the Web Animations API (same keyframes). */
function fx(targets, kf, o = {}) {
  const els = (typeof targets === 'string') ? [...document.querySelectorAll(targets)]
            : (targets && targets.length !== undefined && !targets.nodeType) ? [...targets] : [targets];
  els.forEach((el, i) => {
    if (!el) return;
    const delay = RM ? 0 : (o.delay || 0) + (o.stagger || 0) * i, dur = RM ? 0.001 : (o.duration || 0.5);
    if (MO) { try { MO.animate(el, kf, { duration: dur, delay, ease: o.ease || EASE }); return; } catch (e) { /* fall through */ } }
    try { el.animate(kf, { duration: dur * 1000, delay: delay * 1000, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'both' }); } catch (e) {}
  });
}
/* label picker for scenes: accepts {hi,en} or [en,hi] */
const L = o => Array.isArray(o) ? (lang === 'hi' ? o[1] : o[0]) : (lang === 'hi' ? o.hi : o.en);
/* bilingual HTML block for the UI */
const B = o => lang === 'hi' ? `<span class="hi">${o.hi}</span>` : lang === 'en' ? `<span class="en">${o.en}</span>`
             : `<span class="hi">${o.hi}</span><span class="en">${o.en}</span>`;
const PAL = ['#7c6cff', '#4d8dff', '#19c3e0', '#2ecc9a', '#a3e04f', '#ffc23c', '#ff7a6b'];

/* highlight helper used by every scene: elements carry data-k="key key2" */
function setOn(root, hi, instant) {
  root.querySelectorAll('[data-k]').forEach(el => {
    const hit = el.dataset.k.split(' ').some(k => hi.includes(k));
    if (el.classList.contains('tag')) { el.classList.toggle('on', hit); return; }
    el.classList.toggle('on', hit); el.classList.toggle('off', !hit && hi.length > 0);
    if (hit && !instant) fx(el, { transform: ['scale(1)', 'scale(1.07)', 'scale(1)'] }, { duration: 0.7 });
  });
}
const SCENES = {};
/* text of an HTML-escaped string (for CSS content and plain-text places) */
const TXT = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };

/* ================= CONCEPT SCENE =================
   Works for any subject: the idea behind the question as 2–5 short points.
   On answer, the points the answer rests on (key) light up and the rest dim. */
SCENES.concept = (host, P) => {
  const pts = P.points || [];
  host.innerHTML = `<div class="cx"><div class="cx-h">${P.title ? L(P.title) : ''}</div><div class="cx-l">${pts.map((p, i) => `<div class="cx-c" style="--c:${PAL[i % PAL.length]}"><span class="cx-n">${i + 1}</span><span class="cx-t">${L(p)}</span></div>`).join('')}</div></div>`;
  const cards = [...host.querySelectorAll('.cx-c')];
  fx(cards, { opacity: [0, 1], transform: ['translateY(14px)', 'translateY(0px)'] }, { duration: 0.5, stagger: 0.08 });
  return {
    reveal(inst) {
      cards.forEach((c, i) => {
        const on = !!pts[i].key; c.classList.toggle('on', on); c.classList.toggle('off', !on);
        if (on && !inst) fx(c, { transform: ['scale(1)', 'scale(1.04)', 'scale(1)'] }, { duration: 0.6, delay: i * 0.05 });
      });
    },
    destroy() {}
  };
};
function mountScene(host, sc) {
  host.innerHTML = '';
  const make = SCENES[sc && sc.t] || SCENES.concept;
  try { return make(host, (sc && sc.p) || {}); } catch (e) { console.warn('scene failed', e); return { reveal() {}, destroy() {} }; }
}
/* ================= APP ================= */
const UI = {
  start: { hi: 'शुरू करें', en: 'Start' }, next: { hi: 'अगला →', en: 'Next →' }, prev: { hi: '← पिछला', en: '← Back' },
  finish: { hi: 'परिणाम देखें', en: 'See result' }, ok: { hi: 'सही उत्तर!', en: 'Correct!' }, no: { hi: 'गलत — सही उत्तर', en: 'Not quite — correct answer' },
  again: { hi: 'फिर से खेलें', en: 'Play again' }, reveal: { hi: 'उत्तर देखें', en: 'Reveal answer' }, ans: { hi: 'सही उत्तर', en: 'Answer' }, home: { hi: 'शुरुआत पर जाएँ', en: 'Back to start' }
};
const NAVB = { prev: '← पिछला · Back', next: 'अगला · Next →', finish: 'परिणाम · Result' };            // compact labels for the bottom bar in 'both' mode
const UN = (k, o) => lang === 'both' ? NAVB[k] : U(o);
const U = o => lang === 'hi' ? o.hi : lang === 'en' ? o.en : o.hi + ' / ' + o.en;
const view = $('#view');
const revealed = {};          // revealed[i] = teacher showed the answer without a student choosing
let idx = -1, screen = 'start', answers = Array(Q.length).fill(null), scene = null, streak = 0;
const score = () => answers.filter((a, i) => a === Q[i].a).length, done = () => answers.filter(a => a !== null).length;

function hud() {
  $('#sc').textContent = done() ? `${score()}/${done()}` : '';
  $('#pg').style.width = (done() / Q.length * 100) + '%';
  document.querySelectorAll('.lg button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
}
function setLang(l) { lang = l; hud(); go(); }
function go() { if (scene) { scene.destroy(); scene = null; } ({ start: startScreen, quiz: () => showQ(idx), result: resultScreen })[screen](); }


function startScreen() {
  screen = 'start'; idx = -1;
  view.innerHTML = `<div class="hero"><h1><span class="a">${L(CFG.title)}</span></h1>
   <p>${B(CFG.sub)}</p>
   <div class="chips"><i>${Q.length} ${lang === 'en' ? 'questions' : 'प्रश्न'}</i><i>${lang === 'en' ? 'Visual explanations' : 'चित्रात्मक व्याख्या'}</i><i>${lang === 'en' ? 'Hindi + English' : 'हिन्दी + English'}</i></div>
   <p>${B({ hi: 'हर प्रश्न का उत्तर देने पर उसकी व्याख्या और मुख्य बिंदु सामने आते हैं।', en: 'Answer each question to see its explanation and the key points behind it.' })}</p>
   <div style="margin-top:26px"><button class="btn" id="go">${U(UI.start)}</button></div>
   <div class="credit">${lang === 'en' ? 'Questions' : 'प्रश्न'}: ${CFG.brand}</div></div>`;
  fx($('.hero'), { opacity: [0, 1], transform: ['translateY(20px)', 'translateY(0px)'] }, { duration: 0.7 });
  $('#go').onclick = () => { answers.fill(null); streak = 0; for (const k in revealed) delete revealed[k]; hud(); showQ(0); };
}

function showQ(i) {
  if (scene) { scene.destroy(); scene = null; }
  screen = 'quiz'; idx = i; const q = Q[i], last = i === Q.length - 1;
  view.innerHTML = `<div class="stage"><div class="scene" id="scene" role="img" aria-label="${lang === 'en' ? 'Interactive visual explanation' : 'चित्रात्मक व्याख्या'}"></div><div id="qa">
   <span class="qn">${lang === 'en' ? 'Q' : 'प्र'} ${i + 1} / ${Q.length}</span><div class="qt">${B(q.q)}</div>
   <div class="opts">${q.o.map((o, k) => `<button class="opt" data-i="${k}" aria-label="${'ABCD'[k]}"><span class="l">${'abcd'[k]}</span><span class="tx">${B(o)}</span></button>`).join('')}</div>
   <div class="exp" id="exp"></div>
   <div class="nav"><button class="btn sec" id="pv" ${i === 0 ? 'disabled' : ''}>${UN('prev', UI.prev)}</button><button class="btn ghost" id="rv" title="${UI.reveal.hi} / ${UI.reveal.en}  [R]">👁&nbsp;${lang === 'en' ? UI.reveal.en : UI.reveal.hi}</button><button class="btn" id="nx">${last ? UN('finish', UI.finish) : UN('next', UI.next)}</button></div>
   <div class="dots">${Q.map((_, k) => `<i data-d="${k}" class="${answers[k] === null ? (revealed[k] ? 'rv' : '') : answers[k] === Q[k].a ? 'ok' : 'no'} ${k === i ? 'cur' : ''}"></i>`).join('')}</div></div></div>`;
  scene = mountScene($('#scene'), q.sc);
  fx($('#qa'), { opacity: [0, 1], transform: ['translateY(16px)', 'translateY(0px)'] }, { duration: 0.5 });
  view.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  view.querySelectorAll('.dots i').forEach(d => d.onclick = () => showQ(+d.dataset.d));
  $('#pv').onclick = () => showQ(i - 1);
  $('#nx').onclick = () => { if (last) return resultScreen(); showQ(i + 1); };
  $('#rv').onclick = () => revealAnswer();
  if (answers[i] !== null) apply(answers[i], true); else if (revealed[i]) apply(null, true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function apply(k, inst) {
  const q = Q[idx], shown = k === null, good = k === q.a, rr0 = $('#rv'); if (rr0) rr0.style.display = 'none';
  view.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; b.classList.toggle('ok', j === q.a); b.classList.toggle('no', !shown && j === k && !good); b.classList.toggle('faded', j !== q.a && j !== k); b.setAttribute('aria-pressed', j === k ? 'true' : 'false'); if (!inst && j === q.a) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); } });
  const e = $('#exp'); e.className = 'exp' + (shown ? ' neutral' : good ? '' : ' bad'); e.style.display = 'block';
  e.innerHTML = `<h4 style="color:${shown ? 'var(--accent)' : good ? 'var(--good)' : 'var(--bad)'}">${shown ? U(UI.ans) + ' (' + 'abcd'[q.a] + ')' : good ? U(UI.ok) : U(UI.no) + ' (' + 'abcd'[q.a] + ')'}</h4>${B(q.ex)}`;
  if (!inst) fx(e, { opacity: [0, 1], transform: ['translateY(14px)', 'translateY(0px)'] }, { duration: 0.5, delay: 0.1 });
  $('#nx').disabled = false;
  try { scene.reveal(inst); } catch (err) { console.warn('scene reveal failed', err); }
  const d = $(`.dots i[data-d="${idx}"]`); if (d) d.className = (shown ? 'rv' : good ? 'ok' : 'no') + ' cur';
}

function revealAnswer() {
  if (screen !== 'quiz' || answers[idx] !== null || revealed[idx]) return;
  revealed[idx] = true; apply(null, false);
  if (window.innerWidth < 920) setTimeout(() => $('#exp')?.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'center' }), 250);
}

function choose(k) {
  if (answers[idx] !== null || revealed[idx]) return;
  answers[idx] = k; const good = k === Q[idx].a; streak = good ? streak + 1 : 0;
  apply(k, false); hud();
  try { if (navigator.vibrate && !RM) navigator.vibrate(good ? 14 : [24, 40, 24]); } catch (e) {}
  if (good) burst($(`.opt[data-i="${k}"]`)); else fx($(`.opt[data-i="${k}"]`), { transform: ['translateX(0px)', 'translateX(-8px)', 'translateX(8px)', 'translateX(-5px)', 'translateX(0px)'] }, { duration: 0.4 });
  if (window.innerWidth < 920) setTimeout(() => $('#exp')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 250);
}

function burst(el) {
  if (RM) return;
  const r = el.getBoundingClientRect(), layer = $('#fxlayer');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('i'), a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
    p.style.cssText = `position:fixed;left:${r.left + 30}px;top:${r.top + r.height / 2}px;width:9px;height:9px;border-radius:${i % 2 ? '50%' : '2px'};background:${PAL[i % 7]};pointer-events:none;z-index:50`;
    layer.appendChild(p);
    fx(p, { transform: ['translate(0px,0px) scale(1)', `translate(${Math.cos(a) * d}px,${Math.sin(a) * d - 30}px) scale(.2)`], opacity: [1, 0] }, { duration: 0.9, ease: [0.16, 1, 0.3, 1] });
    setTimeout(() => p.remove(), 1000);
  }
}

function resultScreen() {
  if (scene) { scene.destroy(); scene = null; }
  screen = 'result'; idx = Q.length; const s = score(), pct = Math.round(s / Q.length * 100), R = 86, C = 2 * Math.PI * R;
  const msg = pct >= 90 ? { hi: 'शानदार! आप तैयार हैं।', en: 'Outstanding! You are exam-ready.' } : pct >= 70 ? { hi: 'बहुत बढ़िया! थोड़ा और अभ्यास।', en: 'Great work! A little more practice.' } : pct >= 40 ? { hi: 'अच्छी शुरुआत — गलत प्रश्नों की समीक्षा करें।', en: 'Good start — review the ones you missed.' } : { hi: 'चिंता न करें — समीक्षा करके फिर प्रयास करें।', en: 'No worries — review and try again.' };
  view.innerHTML = `<div class="hero"><h1>${lang === 'en' ? 'Your score' : 'आपका स्कोर'}</h1>
   <div class="ring-wrap"><svg viewBox="0 0 200 200" width="200" height="200"><circle cx="100" cy="100" r="${R}" fill="none" stroke="#ffffff1f" stroke-width="16"/><circle id="rg" cx="100" cy="100" r="${R}" fill="none" stroke="url(#gd)" stroke-width="16" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="${C}" stroke-dashoffset="${C}"/><defs><linearGradient id="gd"><stop offset="0" stop-color="#ffc23c"/><stop offset="1" stop-color="#2ecc9a"/></linearGradient></defs></svg><b>${s}/${Q.length}</b></div>
   <p>${B(msg)}</p><p style="color:var(--mute);font-size:13px">${lang === 'en' ? 'Tap a number to review that question' : 'किसी प्रश्न की समीक्षा के लिए उसकी संख्या दबाएँ'}</p>
   <div class="chips">${Q.map((q, i) => `<i data-r="${i}" style="cursor:pointer;border-color:${answers[i] === q.a ? 'var(--good)' : answers[i] === null ? '#ffffff30' : 'var(--bad)'};color:${answers[i] === q.a ? 'var(--good)' : answers[i] === null ? 'var(--mute)' : 'var(--bad)'}">${i + 1}</i>`).join('')}</div>
   <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px"><button class="btn" id="rp">${U(UI.again)}</button><button class="btn sec" id="hm">${U(UI.home)}</button></div></div>`;
  fx($('#rg'), { strokeDashoffset: [C, C * (1 - s / Q.length)] }, { duration: 1.4 });
  view.querySelectorAll('[data-r]').forEach(c => c.onclick = () => showQ(+c.dataset.r));
  $('#rp').onclick = () => { answers.fill(null); streak = 0; for (const k in revealed) delete revealed[k]; hud(); showQ(0); }; $('#hm').onclick = () => { hud(); startScreen(); };
  hud(); window.scrollTo({ top: 0 });
}

document.querySelectorAll('.lg button').forEach(b => b.onclick = () => setLang(b.dataset.l));
document.addEventListener('keydown', e => {
  if (screen !== 'quiz' || e.metaKey || e.ctrlKey) return;
  if (e.key.toLowerCase() === 'r') { revealAnswer(); return; }
  const k = 'abcd'.indexOf(e.key.toLowerCase()), n = '1234'.indexOf(e.key);
  if (k > -1 || n > -1) choose(k > -1 ? k : n);
  else if ((e.key === 'ArrowRight' || e.key === 'Enter') && !$('#nx').disabled) $('#nx').click();
  else if (e.key === 'ArrowLeft' && idx > 0) showQ(idx - 1);
});
if (CFG.logo) {
  const img = document.createElement('img');
  img.src = CFG.logo; img.alt = ''; img.className = 'logo-img';
  $('#logo').classList.remove('badge'); $('#logo').appendChild(img);
} else $('#logo').textContent = TXT(CFG.initials);
document.documentElement.style.setProperty('--mark', JSON.stringify('© ' + TXT(CFG.brand)));
hud(); startScreen();

/* tiny diagnostics: if anything throws, show the message on screen (tap to dismiss) so it can be reported */
(function () {
  let n = 0;
  const show = (msg, where) => {
    if (n++ > 2) return; const d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:10px;right:10px;bottom:10px;z-index:99;background:#3a0f1a;border:1px solid #ff6b6b;color:#ffd5d5;font:12px/1.4 ui-monospace,monospace;padding:8px 12px;border-radius:10px;cursor:pointer;word-break:break-word';
    d.textContent = '⚠ ' + msg + (where ? '  @ ' + where : '') + '  (tap to dismiss)'; d.onclick = () => d.remove(); document.body.appendChild(d);
  };
  window.addEventListener('error', e => show(e.message || String(e.error), (e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno));
  window.addEventListener('unhandledrejection', e => show('Promise: ' + (e.reason && e.reason.message || e.reason)));
})();

/* ---------- copyright notice: tiled watermark (self-healing) + deterrents ----------
   Honest note: any page that runs in a browser can be copied by a determined person. This makes casual copying,
   screenshots and re-uploads carry the institute's name, and makes removal deliberate rather than accidental. */
(function () {
  const BRAND = CFG.brand.toUpperCase(), yr = new Date().getFullYear(); const y = document.getElementById('yr'); if (y) y.textContent = yr;
  const tile = `<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300"><g transform="rotate(-24 210 150)"><circle cx="185" cy="103" r="17" fill="none" stroke="#ffffff" stroke-width="2.5"/><text x="185" y="108" text-anchor="middle" font-family="Nirmala UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">${CFG.initials}</text><text x="210" y="109" font-family="Nirmala UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.5" fill="#ffffff">${BRAND}</text><text x="170" y="146" font-family="Nirmala UI,Arial,sans-serif" font-size="12" fill="#ffffff">© ${yr} · All rights reserved</text></g></svg>`;
  const url = 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(tile) + '")';
  const mk = () => { let w = document.getElementById('wm'); if (!w) { w = document.createElement('div'); w.id = 'wm'; w.setAttribute('aria-hidden', 'true'); document.body.appendChild(w); } w.style.backgroundImage = url; return w; };
  mk();
  const ok = () => { const w = document.getElementById('wm'); if (!w) return false; const cs = getComputedStyle(w); return cs.display !== 'none' && cs.visibility !== 'hidden' && +cs.opacity >= 0.05 && cs.position === 'fixed' && !!w.style.backgroundImage; };
  const heal = () => { if (!ok()) { const old = document.getElementById('wm'); if (old) old.remove(); mk(); } };
  new MutationObserver(heal).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class', 'id'] });
  setInterval(heal, 4000);
  document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('img, .scene')) e.preventDefault(); });
  document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
})();
</script>
