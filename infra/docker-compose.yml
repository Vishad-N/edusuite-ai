# EduSuite stack (plan §11). Postgres, Redis and storage are never published;
# only Caddy (profile "production") opens ports 80 and 443.
#
# Local:      docker compose -f infra/docker-compose.yml -f infra/docker-compose.local.yml --env-file infra/.env.local up -d
# Production: docker compose -f infra/docker-compose.yml --env-file infra/.env --profile production up -d

name: edusuite

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object store (DN-027). First start needs a one-time setup:
  # `npm run stack:init` creates the layout, imports the access key and creates the bucket.
  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data

  migrate:
    image: ${API_IMAGE:-edusuite-api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    # npm workspaces install the Prisma CLI at the repo root.
    command: ["node", "/repo/node_modules/prisma/build/index.js", "migrate", "deploy"]
    working_dir: /repo/apps/api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${API_IMAGE:-edusuite-api:local}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # Caddy sits in front in production, so trust its X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      S3_ENDPOINT: http://garage:3900
      # The address the desktop app uses for presigned links (signed for this host).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://${FILES_DOMAIN:-files.example.com}}
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      # Only reported to the app (fixture badge); the API never calls Claude itself.
      AI_MODE: ${AI_MODE:-live}
      AI_RATE_LIMIT: ${AI_RATE_LIMIT:-20}
      # API docs at /docs (DN-067): off in production unless "true".
      API_DOCS: ${API_DOCS:-}
    depends_on:
      garage:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # AI worker (plan §04, ADR-2; DN-054): same image, runs queued AI jobs. Only it holds the Claude key.
  worker:
    image: ${API_IMAGE:-edusuite-api:local}
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    # The image's health check probes the API's HTTP port, which the worker doesn't open.
    healthcheck:
      disable: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      AI_MODE: ${AI_MODE:-live}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-2}
      # Optional per-job model overrides (DN-065); empty means AI_MODEL.
      AI_MODEL_PPT_OUTLINE: ${AI_MODEL_PPT_OUTLINE:-}
      AI_MODEL_PAPER_GENERATE: ${AI_MODEL_PAPER_GENERATE:-}
      AI_MODEL_MCQ_EXTRACT: ${AI_MODEL_MCQ_EXTRACT:-}
      AI_MODEL_DPP_GENERATE: ${AI_MODEL_DPP_GENERATE:-}
      AI_MODEL_LESSON_PLAN: ${AI_MODEL_LESSON_PLAN:-}
      AI_MODEL_DOUBT_SOLVE: ${AI_MODEL_DOUBT_SOLVE:-}
      AI_MODEL_YOUTUBE_META: ${AI_MODEL_YOUTUBE_META:-}
      AI_MODEL_NOTICE_DRAFT: ${AI_MODEL_NOTICE_DRAFT:-}
      AI_MODEL_BOOK_CHAPTER: ${AI_MODEL_BOOK_CHAPTER:-}
      AI_MODEL_POSTER_COPY: ${AI_MODEL_POSTER_COPY:-}
      AI_MODEL_DECK_QUIZ: ${AI_MODEL_DECK_QUIZ:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Nightly backup and restore drills (DN-063). Not started with the stack; run with
  #   docker compose ... --profile ops run --rm backup                    (backup)
  #   docker compose ... --profile ops run --rm backup restore.sh         (restore drill)
  # The VPS runs the backup from cron at 02:30 IST (docs/operations/deploy-checklist.md).
  backup:
    image: edusuite-backup:local
    build: ./backup
    profiles: ["ops"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # An S3 repository (Cloudflare R2 / Backblaze B2), e.g. s3:https://<account>.r2.cloudflarestorage.com/edusuite-backups,
      # or /backup-repo (a local volume, for drills only: it is not off-site).
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      SRC_S3_ENDPOINT: http://garage:3900
      SRC_S3_BUCKET: ${S3_BUCKET}
      SRC_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      SRC_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - backuprepo:/backup-repo
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started

  caddy:
    image: caddy:2
    profiles: ["production"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN:?set FILES_DOMAIN}
      UPDATES_DOMAIN: ${UPDATES_DOMAIN:?set UPDATES_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Update feed (written by the release workflow) and the download page.
      - ../updates:/srv/updates:ro
      - ./updates-site:/srv/site:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  garagemeta:
  garagedata:
  caddydata:
  caddyconfig:
  backuprepo:
