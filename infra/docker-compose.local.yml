# Local overrides for testing on one Windows PC with Docker Desktop.
# Ports bind to 127.0.0.1 only, so nothing is reachable from the network.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  garage:
    ports:
      # S3 API, so the desktop app can upload with presigned URLs (Phase 3).
      - "127.0.0.1:3900:3900"
  api:
    environment:
      NODE_ENV: development
      # No proxy locally: the API is reached directly on 127.0.0.1.
      TRUST_PROXY: "false"
      # The desktop app (file://) plus the Vite dev server in a browser.
      CORS_ORIGINS: "null,http://localhost:5173"
      # Garage is published on 127.0.0.1:3900 locally.
      S3_PUBLIC_ENDPOINT: http://localhost:3900
      AI_MODE: ${AI_MODE:-fixture}
    ports:
      - "127.0.0.1:3000:3000"
  worker:
    environment:
      NODE_ENV: development
      # Fixture mode unless infra/.env.local sets AI_MODE=live and a key (DN-012).
      AI_MODE: ${AI_MODE:-fixture}
    # Recorded answers (AI_MODE=record) land in the repo, and fixture mode replays them (DN-065).
    volumes:
      - ../apps/api/fixtures:/repo/apps/api/fixtures
